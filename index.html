function questionsFor(c){return [...COMMON,...c.questions];}
function computeStats(c,record={}){
 const qs=questionsFor(c), answers=record.answers||{};
 const byGroup=GROUPS.map(g=>{const part=qs.filter(q=>q.group===g.id);const scores=part.map(q=>answers[q.id]?.score).filter(v=>Number.isInteger(v)&&v>=1&&v<=10);return {...g,count:scores.length,total:part.length,mean:scores.length?scores.reduce((a,b)=>a+b,0)/scores.length:null};});
 const rated=byGroup.reduce((a,g)=>a+g.count,0),skipped=qs.filter(q=>answers[q.id]?.skipped&&!Number.isInteger(answers[q.id]?.score)).length;
 const weighted=byGroup.filter(g=>g.mean!==null),den=weighted.reduce((a,g)=>a+g.weight,0);
 const score=den?weighted.reduce((a,g)=>a+g.mean*g.weight,0)/den:null;
 return {byGroup,rated,skipped,total:qs.length,done:rated+skipped,score,coverage:Math.round(rated/qs.length*100),complete:rated===qs.length,eligible:rated===qs.length};
}
if(typeof module!=='undefined')module.exports={GROUPS,COMMON,CANDIDATES,questionsFor,computeStats};

 const size=central.reduce((n,b)=>n+b.length,0),end=new Uint8Array(22),e=new DataView(end.buffer);e.setUint32(0,0x06054b50,true);e.setUint16(8,central.length,true);e.setUint16(10,central.length,true);e.setUint32(12,size,true);e.setUint32(16,offset,true);const all=new Uint8Array(offset+size+22);let at=0;for(const b of [...locals,...central,end]){all.set(b,at);at+=b.length;}return all;
}

 body+=wordParagraph('Ответы и оценки','Heading2');for(const [i,q] of questionsFor(c).entries()){const a=r.answers?.[q.id]||{};body+=wordParagraph(`${i+1}. ${q.title}`,'Heading3')+wordParagraph(q.text,'Small')+wordParagraph('Оценка: '+(a.score?`${a.score} / 10`:a.skipped?'Пропущен':'Не задан'))+wordParagraph('Ответ / заметка: '+(a.note||'Не записаны.'));}
 }

</script><script data-app-script="app.js">'use strict';

function icon(n){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[n]||icons.check}</svg>`;}

function validated(raw){
 if(!raw||raw.version!==1||!raw.records||typeof raw.records!=='object'||Array.isArray(raw.records))throw Error('Неизвестный формат файла. Нужна резервная копия этого приложения.');

  for(const q of questionsFor(c)){const a=r.answers?.[q.id];if(!a)continue;if(typeof a!=='object')throw Error('Некорректный ответ.');if(a.score!==undefined&&a.score!==null&&(!Number.isInteger(a.score)||a.score<1||a.score>10))throw Error('Оценки должны быть целыми числами от 1 до 10.');if(a.skipped!==undefined&&typeof a.skipped!=='boolean')throw Error('Некорректный пропуск.');if(a.skipped&&a.score!=null)throw Error('Ответ не может одновременно иметь балл и быть пропущенным.');if(a.note!==undefined&&(typeof a.note!=='string'||a.note.length>30000))throw Error('Некорректная заметка.');out.answers[q.id]={score:a.score??null,skipped:!!a.skipped,note:a.note||''};}
  result.records[c.id]=out;
 }

}

function render(){const c=current();const headings={candidates:'Найдём свою команду',ranking:'Результаты отбора',priority:'Кому звонить первым',method:'Единая логика оценки'};const subtitles={candidates:'Всё для звонка: резюме, вопросы и ваши заметки.',ranking:'Баллы интервью, полнота оценки и факты из резюме.',priority:'Рекомендации по резюме, роли и первые задания.',method:'Понятные критерии для каждого разговора.'};document.title=`Практика · ${headings[view]}`;
 document.querySelector('#app').innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand"><span class="brand-mark">${icon('spark')}</span>практика<span style="color:#93b5a0">.</span></div><div class="brand-caption">Исследовательская команда</div><nav class="nav" aria-label="Основные разделы"><button data-view="candidates" class="${view==='candidates'?'active':''}">${icon('people')}Кандидаты <span class="count">5</span></button><button data-view="ranking" class="${view==='ranking'?'active':''}">${icon('chart')}Результаты</button><button data-view="priority" class="${view==='priority'?'active':''}">${icon('spark')}Приоритет</button><button data-view="method" class="${view==='method'?'active':''}">${icon('book')}Методика</button></nav><div class="sidebar-section">Список кандидатов</div><div class="side-candidates">${CANDIDATES.map(p=>{const s=computeStats(p,state.records[p.id]);return `<button data-candidate="${p.id}" class="side-candidate ${p.id===selected&&view==='candidates'?'selected':''}" aria-current="${p.id===selected&&view==='candidates'?'true':'false'}">${avatar(p)}<span class="names"><strong>${p.name}</strong><small>${s.rated?`${s.rated} из ${s.total} оценено`:(state.records[p.id]?.status||'Не звонили')}</small></span><span class="side-score">${fmt(s.score)}</span></button>`;}).join('')}</div><div class="side-bottom"><div class="side-project"><div class="eyebrow" style="color:#7d9a99;margin-bottom:9px">Направление отбора</div><strong>Мультиагентные системы</strong><p>Исследования · аналитика<br>тестирование · проектирование</p></div></div></aside><main class="main"><div class="topline"><div class="breadcrumb">Практика 2027 <span>/</span><span>${headings[view]}</span></div><div class="storage"><span class="dot"></span><span id="storage-label">${saveError?'Есть проблема с сохранением':'Сохранено в этом браузере'}</span></div></div>${saveError?`<div class="save-error" role="alert">${esc(saveError)}</div>`:''}<div class="heading-row"><div><h1>${headings[view]}</h1><p>${subtitles[view]}</p></div><div class="actions"><button class="btn" data-extra="word-all">${icon('download')}Отчёт Word</button><button class="btn" data-action="export">${icon('download')}Резервная копия</button><button class="btn ghost" data-action="import" title="Восстановить из JSON">${icon('upload')}Импорт</button></div></div>${summaryMetrics()}${view==='candidates'?candidateView(c):view==='ranking'?rankingView():view==='priority'?priorityView():methodView()}<div class="footer-note">Данные звонков хранятся в этом браузере. Для переноса на другой компьютер или в локальную версию используйте резервную копию JSON.</div></main></div>`;
 document.querySelectorAll('.metric>svg').forEach(el=>el.classList.add('metric-icon'));
}
function candidateView(c){const s=computeStats(c,record());return `<div class="mobile-select"><label for="candidate-select">Кандидат</label><select id="candidate-select">${CANDIDATES.map(p=>`<option value="${p.id}" ${p.id===selected?'selected':''}>${p.name} · ${p.role}</option>`).join('')}</select></div><div class="workspace"><section class="panel profile" aria-label="Карточка кандидата"><div class="profile-top">${avatar(c)}<span class="pill ${s.complete?'':'neutral'}">${s.complete?'Анкета оценена':esc(record().status||'Не звонили')}</span></div><h2>${c.name}</h2><p class="role">${c.role}</p><div class="profile-priority"><strong>Приоритет обзвона: ${priorityFor(c.id).rank} из 5</strong><p>${priorityFor(c.id).role}</p><button class="text-button" data-view="priority">Почему эта роль →</button></div><div class="tags">${c.skills.map(t=>`<span class="tag">${t}</span>`).join('')}</div><div class="contacts"><div class="contact">${icon('phone')}${c.tel?`<a href="tel:${c.tel}">${c.phone}</a>`:`<span>${c.phone}</span><span class="pill warning">уточнить</span>`}</div><div class="contact">${icon('mail')}<a href="mailto:${c.email}">${c.email}</a></div><div class="contact muted">${icon('pin')}${c.city}</div></div>${!c.tel?'<div class="warn-text">В исходном номере 12 цифр. Уточните контакт по почте; исправленный номер можно записать ниже.</div>':''}<div class="divider"></div><div class="section-label">Ключевое из резюме</div><p class="bio">${c.experience}</p><ul class="facts">${c.facts.map(f=>`<li>${f}</li>`).join('')}</ul><div class="opinion"><div class="opinion-label">${icon('spark')}Мнение по резюме</div><p>${c.opinion}</p><p class="small">Предварительная гипотеза о роли. Не входит в балл интервью.</p></div><details><summary>Что проверить на звонке</summary><p>${c.verify}</p><p><strong>Пока не подтверждено:</strong> ${c.gaps}</p>${c.learning.length?`<p><strong>Изучает:</strong> ${c.learning.join(', ')}.</p>`:''}</details><details><summary>Образование и сроки</summary><p>${c.education}</p><p>${c.availability}</p></details><div class="source-file">Источник: ${c.source}<br>Достижения приведены со слов кандидата в резюме.</div></section><div><section class="panel scroll-top" id="interview" aria-label="Анкета интервью">${questionView(c)}</section>${callView(c)}</div></div>`;}
function questionView(c){const qs=questionsFor(c),q=qs[question],s=computeStats(c,record()),a=record().answers[q.id]||{},g=GROUPS.find(g=>g.id===q.group);return `<div class="interview-head"><div class="interview-title"><h2>Интервью</h2><span class="pill neutral">${icon('clock')}20–30 минут</span></div><div class="progress-caption"><span>Оценено ${s.rated} из ${s.total}${s.skipped?` · пропущено ${s.skipped}`:''}</span><span>${s.coverage}% оценено</span></div><div class="progress-track"><span style="width:${s.coverage}%"></span></div><div class="group-tabs" aria-label="Разделы анкеты">${GROUPS.map(gp=>`<button class="${gp.id===q.group?'active':''}" data-group="${gp.id}">${gp.short}<small>${s.byGroup.find(x=>x.id===gp.id).count}/${qs.filter(x=>x.group===gp.id).length}</small></button>`).join('')}</div></div><div class="question-body"><div class="question-meta"><span class="eyebrow">Вопрос ${String(question+1).padStart(2,'0')} / ${qs.length}</span><span class="pill ${a.skipped?'warning':'neutral'}">${a.skipped?'Пропущен':q.group==='tech'?'По резюме':'Общий вопрос'}</span></div><h3>${q.title}</h3><p class="question-text">${q.text}</p><p class="followup"><strong>Уточните:</strong> ${q.probe}</p><details class="answer-box"><summary>${icon('check')}${['interest','drive'].includes(q.group)?'Ориентиры сильного ответа':'Эталон ответа и ключевые пункты'}</summary><p>${q.answer}</p>${q.source?`<a class="source-link" href="${q.source}" target="_blank" rel="noopener noreferrer">Справочный источник ↗</a>`:''}</details><div class="score-label"><span>Ваша оценка ответа</span><span class="small">${Number.isInteger(a.score)?`${a.score} из 10`:a.skipped?'Пропуск не снижает балл':'Выберите от 1 до 10'}</span></div><div class="score-buttons" role="group" aria-label="Оценка ответа от 1 до 10">${Array.from({length:10},(_,i)=>`<button class="score-button ${a.score===i+1?'selected':''}" aria-pressed="${a.score===i+1}" aria-label="Оценка ${i+1} из 10" data-score="${i+1}">${i+1}</button>`).join('')}</div><div class="scale"><span>Нужна помощь</span><span>Уверенный ответ</span></div><div class="rubric">${q.anchors.map(t=>`<div>${t}</div>`).join('')}</div><label class="field-label" for="answer-note">Коротко: что ответил кандидат</label><textarea id="answer-note" data-field="answer-note" maxlength="30000" placeholder="Пример, аргумент, пробел в знаниях…">${esc(a.note||'')}</textarea><div class="question-nav"><button class="btn ghost" data-action="prev" ${question===0?'disabled':''}>← Назад</button><div class="actions">${a.score||a.skipped?'<button class="btn ghost" data-action="clear-answer" title="Убрать балл или пропуск, сохранив заметку">Снять оценку</button>':''}<button class="btn ghost" data-action="skip">Пропустить</button><button class="btn primary" data-action="next">${question===qs.length-1?'Итоги':`Далее ${icon('arrow')}`}</button></div></div></div><div class="interview-footer"><div class="question-dots" aria-label="Перейти к вопросу">${qs.map((x,i)=>{const v=record().answers[x.id]||{};return `<button data-question="${i}" class="q-dot ${v.score?'rated':v.skipped?'skipped':''} ${i===question?'active':''}" aria-label="Вопрос ${i+1}: ${x.title}${v.score?`, балл ${v.score}`:v.skipped?', пропущен':''}" title="${esc(x.title)}">${i+1}</button>`;}).join('')}</div><div class="legend"><span>Оценён</span><span>Пропущен</span><span>Не задан</span></div></div>`;}
function callView(c){const r=record();return `<section class="panel call-panel"><h3>Итоги звонка и договорённости</h3><p class="muted small">Сроки и занятость фиксируются отдельно, без влияния на баллы.</p><div class="form-grid"><label>Статус звонка<select data-field="status">${STATUS.map(s=>`<option ${r.status===s?'selected':''}>${s}</option>`).join('')}</select></label><label>Звонок / перезвонить<input type="datetime-local" data-field="callDate" value="${esc(r.callDate||'')}"></label><label>Подтверждённые даты и формат<input data-field="availability" maxlength="30000" value="${esc(r.availability||'')}" placeholder="Например: 1–28 марта, удалённо"></label><label>Доступность, часов в неделю<input data-field="hours" maxlength="30000" value="${esc(r.hours||'')}" placeholder="Уточните на звонке"></label></div>${!c.tel?`<label class="field-label" for="correct-contact">Уточнённый телефон</label><input id="correct-contact" class="input" data-field="contact" value="${esc(r.contact||'')}" placeholder="Запишите подтверждённый номер" style="margin-bottom:14px">`:''}<label class="field-label" for="call-notes">Общие заметки и следующий шаг</label><textarea id="call-notes" data-field="notes" maxlength="30000" placeholder="Что заинтересовало, что проверить дальше, о чём договорились…">${esc(r.notes||'')}</textarea><div class="decision-row"><label for="decision">Ваше решение</label><select id="decision" data-field="decision">${DECISIONS.map(d=>`<option ${r.decision===d?'selected':''}>${d}</option>`).join('')}</select></div><div class="actions" style="margin-top:16px"><button class="btn primary" data-action="finish">${icon('check')}Завершить звонок</button><button class="btn ghost" data-view="ranking">Открыть результаты</button><button class="btn" data-extra="word-candidate">Отчёт по кандидату .docx</button></div></section>`;}
function ordered(){return CANDIDATES.map(c=>({c,s:computeStats(c,state.records[c.id]),r:state.records[c.id]||{}})).sort((a,b)=>Number(b.s.eligible)-Number(a.s.eligible)||(b.s.score??-1)-(a.s.score??-1)||b.s.rated-a.s.rated);}
function bars(s){return `<div class="category-bars">${s.byGroup.map(g=>`<div class="bar-row"><span>${g.short}</span><div class="bar-track"><span style="width:${g.mean===null?0:g.mean*10}%"></span></div><span>${fmt(g.mean)}</span></div>`).join('')}</div>`;}
function evidence(x){const {c,s,r}=x;return `<details class="panel evidence" ${s.rated||s.skipped?'open':''}><summary>${avatar(c)}<span><strong>${c.name}</strong><span class="muted small" style="display:block">${c.role}</span></span><span class="pill ${s.complete?'':'neutral'}">${s.rated?`${fmt(s.score)} / 10`:'Нет оценок'}</span></summary><div class="evidence-body"><div class="evidence-cols"><div><div class="section-label">Анкета</div>${bars(s)}<p><strong>Оценено:</strong> ${s.rated}/${s.total} · <strong>Пропущено:</strong> ${s.skipped} · <strong>Не задано:</strong> ${s.total-s.done}</p><p><strong>Статус:</strong> ${esc(r.status||'Не звонили')}<br><strong>Решение:</strong> ${esc(r.decision||'Не принято')}</p>${r.availability?`<p><strong>Даты / формат:</strong> ${esc(r.availability)}</p>`:''}${r.hours?`<p><strong>Занятость:</strong> ${esc(r.hours)}</p>`:''}${r.callDate?`<p><strong>Звонок:</strong> ${esc(r.callDate.replace('T',' '))} (местное время)</p>`:''}${r.contact?`<p><strong>Уточнённый телефон:</strong> ${esc(r.contact)}</p>`:''}${r.notes?`<p style="white-space:pre-wrap;overflow-wrap:anywhere"><strong>Ваши заметки:</strong><br>${esc(r.notes)}</p>`:'<p class="muted">Общие заметки пока не добавлены.</p>'}<button class="btn" data-candidate="${c.id}">Продолжить интервью ${icon('arrow')}</button></div><div><div class="section-label">Мнение по резюме · вне балла</div><p>${c.opinion}</p><p><strong>Проверить:</strong> ${c.gaps}</p><p><strong>Следующий вопрос:</strong> ${c.verify}</p><p class="source-file">Источник: ${c.source}</p></div></div><details style="margin-top:18px"><summary class="small" style="cursor:pointer">Все ответы и заметки · ${s.total} вопросов</summary><div style="margin-top:12px">${questionsFor(c).map((q,i)=>{const a=r.answers?.[q.id]||{};return `<div class="response-row"><span class="response-badge">${a.score?`${a.score} / 10`:a.skipped?'Пропущен':'Не задан'}</span><strong>${i+1}. ${q.title}</strong><p>${esc(a.note||'Заметка не добавлена.')}</p></div>`;}).join('')}</div></details></div></details>`;}
function rankingView(){const rows=ordered(),eligible=rows.filter(x=>x.s.eligible);let prev=null,pos=0;const ranked=eligible.map((x,i)=>{if(x.s.score!==prev)pos=i+1;prev=x.s.score;return {...x,rank:pos};});return `<div class="banner">Итоговый топ формируется только по полностью оценённым анкетам: <strong>11 из 11 вопросов</strong>. Пропуски исключаются из среднего; все неполные анкеты показываются ниже с предварительным баллом. Мнение по резюме в балл не входит.</div>${ranked.length?`<div class="ranking-grid">${ranked.slice(0,3).map(x=>`<section class="panel rank-card"><div class="rank-number">${String(x.rank).padStart(2,'0')} / МЕСТО</div><h3>${x.c.name}</h3><p>${x.c.role}</p><div class="rank-score">${fmt(x.s.score)} <small>/ 10</small></div><p>Все вопросы оценены · ${esc(x.r.decision||'Решение не принято')}</p><button class="text-button" data-candidate="${x.c.id}">Открыть анкету →</button></section>`).join('')}</div>`:'<div class="panel empty">В итоговом топе пока никого нет.<br>После полной оценки кандидатов здесь появятся лидеры.</div>'}${comparisonSection(rows)}<div class="section-heading"><h2>Сравнение кандидатов</h2><div class="actions"><button class="btn" data-action="csv">${icon('download')}CSV</button><button class="btn" data-action="print">${icon('print')}Печать</button></div></div><section class="panel table-wrap"><table class="results-table"><thead><tr><th>Кандидат</th><th>Балл / 10</th>${GROUPS.map(g=>`<th>${g.short}<br>${g.weight}%</th>`).join('')}<th>Оценено</th><th>Решение</th></tr></thead><tbody>${rows.map(x=>`<tr><td><div class="name-cell">${avatar(x.c)}<div><button class="name-link" data-candidate="${x.c.id}">${x.c.name}</button><div class="muted" style="font-size:9px;margin-top:3px">${x.s.eligible?'Полная анкета':x.s.rated?'Предварительная оценка':'Нет оценок'}</div></div></div></td><td class="score">${fmt(x.s.score)}</td>${x.s.byGroup.map(g=>`<td class="category-score">${fmt(g.mean)}<div class="muted" style="font-size:9px">${g.count}/${g.total}</div></td>`).join('')}<td>${x.s.rated}/${x.s.total}<div class="muted" style="font-size:9px">${x.s.skipped} пропущено</div></td><td><span class="pill ${x.r.decision==='Следующий этап'?'':'neutral'}">${esc(x.r.decision||'Не принято')}</span></td></tr>`).join('')}</tbody></table></section><div class="section-heading"><h2>Детали и мнение по резюме</h2><span class="muted small">Решение остаётся за вами</span></div><div class="evidence-list">${rows.map(evidence).join('')}</div>`;}
function methodView(){return `<article class="panel method"><h2>Как провести интервью</h2><p>На каждого кандидата подготовлено 11 вопросов: 7 общих и 4 по указанным в резюме навыкам. Примерная длительность — 20–30 минут. Вопрос можно пропустить, а затем вернуться к нему через номера внизу анкеты. Выбранный балл сохраняется сразу; кнопка «Далее» только переключает вопрос.</p><h3>Четыре области оценки</h3><table class="method-table">${GROUPS.map(g=>`<tr><td>${g.name}</td><td>${g.weight}%</td><td>${g.id==='topic'?3:g.id==='tech'?4:2} вопроса</td></tr>`).join('')}</table><p>В каждой области считается среднее выставленных баллов. Итог полной анкеты: интерес × 0,20 + мотивация × 0,20 + понимание темы × 0,30 + навыки × 0,30. Если область ещё не оценена, предварительный балл нормируется по сумме весов оценённых областей. Округление до одного знака используется только для показа; сортировка учитывает точный балл. Равные точные баллы получают одинаковое место.</p><h3>Что означает шкала</h3><ul><li><strong>1–3:</strong> существенные пробелы, общие слова или неверная основа.</li><li><strong>4–7:</strong> понятная основа и конкретный пример; часть ответа может потребовать подсказки.</li><li><strong>8–10:</strong> самостоятельный, обоснованный ответ с ограничениями и способом проверки.</li></ul><p>Под каждым вопросом есть отдельные ориентиры. Для мотивации и интереса нет единственного правильного ответа: оценивайте конкретные действия и аргументы. Не подменяйте желание работать готовностью перерабатывать или уверенной манерой речи.</p><h3>Пропуски и справедливое сравнение</h3><p>Пропуск не равен нулю и не входит в среднее. Итоговый топ требует оценить все 11 вопросов; остальные анкеты остаются предварительными. Технические вопросы различаются по профилю и сложности: высокий балл в базовом Excel не означает тот же уровень технической подготовки, что высокий балл за валидацию ML. Сопоставляйте балл, роль, содержание ответов и факты резюме.</p><h3>Мнение по резюме</h3><p>Это заранее подготовленная качественная оценка связи заявленного опыта с задачами исследования, аналитики, тестирования и проектирования мультиагентных систем. Она не пересчитывается по ответам и не добавляет баллы. Достижения из резюме не проверены независимо. Возраст, пол и другие личные признаки не участвуют в оценке.</p><h3>Сохранение и перенос</h3><p>Оценки, заметки, договорённости и решения сохраняются автоматически в localStorage этого браузера. Между устройствами они не синхронизируются. JSON сохраняет все анкеты и позволяет восстановить их через «Импорт». Импорт заменяет текущие анкеты после подтверждения. CSV нужен для просмотра результатов и ответов в таблице; для восстановления используйте JSON. Очистка данных браузера или приватный режим могут удалить записи.</p><h3>Справочные материалы к вопросам</h3><ul><li><a href="https://www.anthropic.com/engineering/building-effective-agents" target="_blank" rel="noopener noreferrer">Anthropic — базовые архитектурные паттерны агентов</a></li><li><a href="https://scikit-learn.org/stable/common_pitfalls.html" target="_blank" rel="noopener noreferrer">scikit-learn — разделение данных и утечки</a></li><li><a href="https://www.postgresql.org/docs/current/tutorial-join.html" target="_blank" rel="noopener noreferrer">PostgreSQL — соединения таблиц</a></li></ul><div class="notice">Завершение звонка фиксирует статус. Оно не заполняет пропущенные оценки и не принимает решение за интервьюера.</div></article>`;}
function goQuestion(n){question=Math.max(0,Math.min(questionsFor(current()).length-1,n));record().cursor=question;persist();render();}
function selectCandidate(id){if(!CANDIDATES.some(c=>c.id===id))return;selected=id;question=record().cursor||0;view='candidates';render();window.scrollTo({top:0,behavior:'smooth'});}
function download(text,type,name){const blob=new Blob([text],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function dateStamp(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function csvValue(v){let s=String(v??'');if(/^[\s]*[=+\-@]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';}
function exportCsv(){const header=['Кандидат','Профиль','Общий балл','Полнота','Оценено','Пропущено',...GROUPS.map(g=>g.name),'Статус','Решение','Даты и формат','Часы в неделю','Звонок','Уточнённый телефон','Общие заметки','Мнение по резюме','Что проверить','Раздел','Вопрос','Балл ответа','Состояние ответа','Заметка к ответу'];const rows=[header];for(const {c,s,r} of ordered()){for(const q of questionsFor(c)){const a=r.answers?.[q.id]||{};rows.push([c.full,c.role,fmt(s.score),s.complete?'Полная':'Предварительная',s.rated,s.skipped,...s.byGroup.map(g=>fmt(g.mean)),r.status||'Не звонили',r.decision||'Не принято',r.availability,r.hours,r.callDate,r.contact,r.notes,c.opinion,c.gaps,GROUPS.find(g=>g.id===q.group).name,q.title,a.score??'',a.score?'Оценён':a.skipped?'Пропущен':'Не задан',a.note]);}}download('\ufeff'+rows.map(r=>r.map(csvValue).join(';')).join('\r\n'),'text/csv;charset=utf-8',`praktika-results-${dateStamp()}.csv`);toast('CSV со всеми ответами выгружен');}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b||b.disabled)return;
 if(b.dataset.view){view=b.dataset.view;render();window.scrollTo({top:0,behavior:'smooth'});return;}
 if(b.dataset.candidate){selectCandidate(b.dataset.candidate);return;}
 if(b.dataset.group){goQuestion(questionsFor(current()).findIndex(q=>q.group===b.dataset.group));return;}
 if(b.dataset.question!==undefined){goQuestion(Number(b.dataset.question));return;}
 const qs=questionsFor(current()),q=qs[question];
 if(b.dataset.score){const a=record().answers[q.id]||(record().answers[q.id]={});a.score=Number(b.dataset.score);a.skipped=false;touch();const wasOpen=document.querySelector('.answer-box')?.open;render();if(wasOpen)document.querySelector('.answer-box').open=true;return;}
 switch(b.dataset.action){
  case 'prev':goQuestion(question-1);break;
  case 'next':if(question===qs.length-1){view='ranking';render();window.scrollTo({top:0,behavior:'smooth'});}else goQuestion(question+1);break;
  case 'skip':{const a=record().answers[q.id]||(record().answers[q.id]={});a.score=null;a.skipped=true;touch();if(question<qs.length-1)goQuestion(question+1);else{render();toast('Последний вопрос пропущен. Откройте итоги или вернитесь к вопросам.');}break;}
  case 'clear-answer':{const a=record().answers[q.id]||(record().answers[q.id]={});a.score=null;a.skipped=false;touch();render();break;}
  case 'finish':record().status='Интервью завершено';touch();view='ranking';render();window.scrollTo({top:0,behavior:'smooth'});toast('Звонок завершён. Баллы и заметки сохранены в текущей сессии.');break;
  case 'export':download(JSON.stringify({...state,exportedAt:new Date().toISOString(),app:'Практика · интервью'},null,2),'application/json',`praktika-backup-${dateStamp()}.json`);toast('Резервная копия JSON выгружена');break;
  case 'import':document.querySelector('#import-file').click();break;
  case 'csv':exportCsv();break;
  case 'print':document.querySelectorAll('.evidence,.evidence-body details').forEach(d=>d.open=true);window.print();break;
 }
});
document.addEventListener('input',e=>{const f=e.target.dataset.field;if(!f||e.target.tagName==='SELECT')return;if(f==='answer-note'){const q=questionsFor(current())[question];const a=record().answers[q.id]||(record().answers[q.id]={});a.note=e.target.value;}else record()[f]=e.target.value;touch();});
document.addEventListener('change',async e=>{
 if(e.target.id==='candidate-select'){selectCandidate(e.target.value);return;}
 if(e.target.tagName==='SELECT'&&e.target.dataset.field){record()[e.target.dataset.field]=e.target.value;touch();render();return;}
 if(e.target.id==='import-file'){const f=e.target.files[0];e.target.value='';if(!f)return;try{if(f.size>3000000)throw Error('Файл больше 3 МБ. Выберите резервную копию этого приложения.');const imported=validated(JSON.parse(await f.text()));if(!confirm('Заменить текущие анкеты данными из файла? При необходимости сначала отмените и сохраните резервную копию.'))return;state=imported;storageBlocked=false;question=record().cursor||0;const ok=persist();render();toast(ok?'Резервная копия восстановлена':'Данные загружены в сессию, но автосохранение недоступно.');}catch(err){toast(`Импорт отменён: ${err.message}`);}}
});
window.addEventListener('storage',e=>{if(e.key===KEY){storageBlocked=true;saveError='Анкеты изменились в другой вкладке. Эта вкладка временно не записывает данные. Сохраните нужные изменения в JSON и обновите страницу.';render();}});
render();
</script></body></html>
